services:
  workify:
    container_name: ${CONTAINER_NAME}

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - proxy

    labels:
      - traefik.enable=true

      - traefik.http.routers.${ROUTER_NAME}.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.${ROUTER_NAME}.entrypoints=websecure
      - traefik.http.routers.${ROUTER_NAME}.tls=true
      - traefik.http.routers.${ROUTER_NAME}.tls.certresolver=letsencrypt

      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
